# ─────────────────────────────────────────────────────────────
# champions.yml — surcharges d'equilibrage rechargeables a chaud (/lol reload)
#
# Les valeurs du jeu (patch 26.20 : delais, couts par rang, degats, ratios) sont dans le
# code de chaque champion. Ce fichier ne sert qu'a les SURCHARGER pour tes propres reglages :
# une cle absente => la valeur du code s'applique. (Avant, toutes les valeurs etaient
# dupliquees ici et ecrasaient le code : une correction du code n'arrivait jamais en jeu.)
#
# Cle = identifiant du sort (q_<champion>, w_<champion>, e_<champion>, r_<champion>).
#   cooldown : liste par rang (5 pour Q/W/E, 3 pour R)
#   cost     : cout mana/energie, nombre ou liste par rang
#   base     : degats de base par rang (si le sort en a)
#   ratio_ad / ratio_ap : ratios (ad = AD bonus ou total selon le sort, voir le code)
#
# Exemple :
#   q_annie:
#     cooldown: [4, 4, 4, 4, 4]
#     base: [80, 125, 170, 215, 260]
#     ratio_ap: 0.8
#
# version : augmentee a chaque mise a jour de ce fichier livre. Au demarrage, si le fichier
# du serveur a une version plus ancienne, il est sauvegarde (champions.yml.v<ancienne>.bak)
# puis remplace. Garde la meme version pour tes propres reglages.
# ─────────────────────────────────────────────────────────────
version: 3
