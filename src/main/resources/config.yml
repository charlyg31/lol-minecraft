# ═══════════════════════════════════════════════════════
# BRIDGE CROSS-SERVEUR (BungeeCord)
# ═══════════════════════════════════════════════════════
# Permet aux joueurs de configurer leurs runes, groupes
# et file d'attente depuis un serveur lobby séparé,
# puis d'être connectés automatiquement ici pour jouer.
#
# Prérequis :
#  1. BungeeCord avec ce serveur et le serveur lobby
#  2. "bungeecord: true" dans spigot.yml des deux serveurs
#  3. Le plugin LolMC-Lobby.jar installé sur le serveur lobby
#
bridge:
  enabled: false
  # Nom de ce serveur dans la config BungeeCord
  game-server: "lolmc-01"
  # Nom du serveur lobby dans la config BungeeCord
  lobby-server: "lobby"

# ═══════════════════════════════════════════════════════
# MONDE DE JEU
# ═══════════════════════════════════════════════════════
# Nom du monde Minecraft où se déroule la partie LoL.
# Les mécaniques du plugin (sbires, tourelles, brouillard,
# HUD...) ne s'activent que pour les joueurs dans ce monde.
# Cela permet d'avoir d'autres mondes sur le même serveur
# sans interférence (hub, monde de build, etc.).
world:
  # Nom du monde TEMPLATE (configuré une fois via /lol set, jamais utilisé en jeu)
  # Ce monde est copié pour chaque nouvelle instance de partie.
  template: "lolmc_template"
  # Les mondes d'instance sont nommés lolmc_game_1, lolmc_game_2… (préfixe fixe).
  # Mode instances (EXPERIMENTAL) : chaque match du matchmaking local joue dans une copie du monde template.
  # false (défaut) = une seule partie à la fois dans le monde "name" ci-dessous, mode stable.
  use-instances: false
  # Nombre maximum de parties simultanées (mode instances) ; 0 = illimité
  max-instances: 4
  # Nom exact du monde de jeu (dossier dans le répertoire serveur)
  name: "lolmc_template"
  # Monde lobby/hub (optionnel). Si renseigné, c'est ici que
  # les joueurs attendent, configurent leurs runes et forment
  # leurs groupes avant d'être envoyés dans le monde de jeu.
  lobby: "lobby"

# LoL MC — Configuration des textures de têtes
# Pour chaque champion, colle la valeur "Value" depuis :
# https://minecraft-heads.com/custom-heads/tag/League-of-Legends
# Cherche le nom du champion, clique dessus, copie le champ "Value" (base64)

heads:
  # TOP
  garen:       "PASTE_VALUE_HERE"
  malphite:    "PASTE_VALUE_HERE"
  darius:      "PASTE_VALUE_HERE"
  nasus:       "PASTE_VALUE_HERE"
  # JUNGLE
  warwick:     "PASTE_VALUE_HERE"
  amumu:       "PASTE_VALUE_HERE"
  masteryi:    "PASTE_VALUE_HERE"
  leesin:      "PASTE_VALUE_HERE"
  # MID
  annie:       "PASTE_VALUE_HERE"
  veigar:      "PASTE_VALUE_HERE"
  zed:         "PASTE_VALUE_HERE"
  yasuo:       "PASTE_VALUE_HERE"
  # SUPPORT
  morgana:     "PASTE_VALUE_HERE"
  leona:       "PASTE_VALUE_HERE"
  blitzcrank:  "PASTE_VALUE_HERE"
  janna:       "PASTE_VALUE_HERE"
  # ADC
  ashe:        "PASTE_VALUE_HERE"
  sivir:       "PASTE_VALUE_HERE"
  jinx:        "PASTE_VALUE_HERE"
  missfortune: "PASTE_VALUE_HERE"

# ═══════════════════════════════════════════════════════
# BUSHES (buissons) — zones d'invisibilité
# ═══════════════════════════════════════════════════════
# Liste des blocs qui forment un bush. Tout bloc de ce type
# (et les blocs identiques collés) constitue un buisson.
# Quand un joueur est dans/sur un bush, il est invisible pour
# les ennemis, SAUF si un ennemi est dans le même bush ou s'il
# vient de prendre des dégâts (révélé 5s).
bushes:
  blocks:
    - TALL_GRASS
    - LARGE_FERN
    - FERN
    - SWEET_BERRY_BUSH

# ═══════════════════════════════════════════════════════
# CHAMPIONS
# ═══════════════════════════════════════════════════════
# Un joueur ne joue que les champions qu'il possède (permission lolmc.champion.<id>,
# ou lolmc.champion.* pour tous ; les opérateurs les ont tous).
# Rotation gratuite (comme dans LoL) : champions jouables par tout le monde, sans permission.
# Exemple : free-rotation: [garen, annie, ashe, warwick, morgana]
champions:
  free-rotation: []

# ═══════════════════════════════════════════════════════
# COMBAT
# ═══════════════════════════════════════════════════════
shop:
  # LoL : achat uniquement a la fontaine. false = achat partout.
  base-only: true
  base-radius: 15.0

combat:
  # Un clic sur une cible verrouille l'attaque : les AA s'enchaînent
  # automatiquement à la cadence d'attack speed tant que la cible est
  # à portée (comme le clic droit de LoL). Clic dans le vide = annuler.
  aa-lock-on: true

# ═══════════════════════════════════════════════════════
# TOURELLES — portée d'attaque (mêmes valeurs pour toutes)
# ═══════════════════════════════════════════════════════
# Zone d'attaque en forme de CYLINDRE depuis le point de pose du schématique.
turrets:
  # Rayon horizontal de la zone de tir (en blocs). LoL : 750 unités = 7.5 blocs.
  attack-radius: 7.5
  # Hauteur de la zone de DÉTECTION (cylindre, en blocs au-dessus/dessous du point de pose)
  detection-height: 6
  # Hauteur d'où part visuellement l'ANIMATION du tir (en blocs au-dessus du point de pose)
  beam-height: 6
  # (Les dégâts suivent le wiki LoL : selon le niveau de la tourelle et la minute.)

# ═══════════════════════════════════════════════════════
# BASE DE DONNÉES
# ═══════════════════════════════════════════════════════
database:
  # Type de base : "sqlite" (local, simple) ou "mysql"
  type: sqlite
  mysql:
    host: localhost
    port: 3306
    database: lolmc
    user: root
    password: ""
    # Chiffrer la connexion (recommandé si la base n'est pas sur la même machine)
    ssl: false

# ═══════════════════════════════════════════════════════
# API WEB (stats des joueurs)
# ═══════════════════════════════════════════════════════
# IMPORTANT: nécessite un port ouvert sur l'hébergeur pour être
# accessible depuis un site web externe.
api:
  enabled: false
  # Adresse d'écoute : "127.0.0.1" = local uniquement, "0.0.0.0" = toutes les interfaces
  bind: "127.0.0.1"
  port: 8080
  # Clé exigée dans l'en-tête X-Api-Key (vide = pas d'authentification)
  key: ""
  # En-tête Access-Control-Allow-Origin ("" = pas d'en-tête CORS)
  cors-origin: "*"
  # Tableau de bord web (profils, historique, classement) servi sur http://<bind>:<port>/
  # Les fichiers de plugins/LolMC/web/ (index.html, app.js, style.css) remplacent ceux du plugin.
  dashboard: true

# ═══════════════════════════════════════════════════════
# STATISTIQUES
# ═══════════════════════════════════════════════════════
stats:
  # Saison en cours : enregistrée avec chaque partie (classement par saison de l'API)
  season: 1

# ═══════════════════════════════════════════════════════
# INACTIVITÉ (AFK)
# ═══════════════════════════════════════════════════════
afk:
  enabled: true
  # Avertissement après N secondes sans action (déplacement, caméra, clic, sort...)
  warn-seconds: 120
  # Signalé absent à son équipe après N secondes sans action
  flag-seconds: 180
  # Abandon possible dès N minutes si un allié est absent ou déconnecté (15 sinon)
  early-ff-minutes: 5
  # Points d'Elo retirés en classé à un joueur signalé absent (et aucun gain en cas de victoire)
  elo-penalty: 15

# ═══════════════════════════════════════════════════════
# FOG OF WAR (brouillard de guerre)
# ═══════════════════════════════════════════════════════
fog:
  enabled: true
  # Distance de vision des champions en blocs (les ennemis au-delà sont invisibles).
  # LoL : 1350 unités = 13.5 blocs (100 unités = 1 bloc). Ancienne valeur : 30.
  vision-range: 13.5

minimap:
  center-x: 0      # centre X de ta carte LoL (bloc)
  center-z: 0      # centre Z
  # CLOSEST=128b CLOSE=256 NORMAL=512 FAR=1024 FARTHEST=2048 (rayon en blocs).
  # Avec l'échelle par défaut (65 unités LoL/bloc), la carte de jeu fait environ
  # 228 blocs de côté : FARTHEST (2048) l'affichait donc minuscule, au centre d'une
  # image bien trop dézoomée. CLOSE (256) est le premier niveau qui la couvre en entier
  # avec une marge raisonnable — ajuste vers CLOSEST si ta carte est plus petite,
  # ou NORMAL/FAR si elle est plus grande ou si center-x/center-z ne sont pas exacts.
  scale: CLOSE
