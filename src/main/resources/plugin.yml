name: LolMC
version: 1.0.0
main: fr.lolmc.LolPlugin
api-version: '26.3'
description: League of Legends en Minecraft — 20 champions

commands:
  l:
    description: Commandes joueur LoL (en partie)
    usage: /l <runes|ping|ff|stats|shop|recap|honor|grimoire>
  lola:
    description: Commandes admin LoL
    usage: /lola <start|stop|select|join|instance|reload|permcheck|set|position|center|schem|road|jungle|plant|baronpit|shopnpc|mode|template|solo|testgame|give|level|gold|hp|resetcd|buff|spawn|wave|team|debug|help>
    aliases: [lolAdmin]

  # ── Raccourcis joueur (mêmes fonctions que /l, plus le chat d'équipe) ──
  team:
    description: Choisir son équipe / chat d'équipe (/t <message>)
    usage: /team <bleu|rouge|auto>
    permission: lolmc.player.team
  shop:
    description: Ouvrir la boutique
    usage: /shop [gold]
    permission: lolmc.player.shop
  champion:
    description: Choisir ou lister les champions
    usage: /champion <pick <nom>|list>
    permission: lolmc.player.pick
  party:
    description: Gérer son groupe
    usage: /party <invite|accept|leave|info>
    permission: lolmc.player.party
  queue:
    description: Rejoindre ou quitter la file d'attente
    usage: /queue [leave]
    permission: lolmc.player.queue
  recall:
    description: Retourner à la base
    usage: /recall
    permission: lolmc.player.recall
  ping:
    description: Envoyer un ping à l'équipe
    usage: /ping <danger|omw|missing|assist|enemy>
    permission: lolmc.player.ping
  pick:
    description: Choisir son champion
    usage: /pick <champion>
    permission: lolmc.player.pick
  spell:
    description: Choisir ses sorts d'invocateur
    usage: /spell <sort1> <sort2>
    permission: lolmc.player.spell
  lock:
    description: Verrouiller sa sélection
    usage: /lock
    permission: lolmc.player.lock
  runes:
    description: Configurer ses runes
    usage: /runes
    permission: lolmc.player.runes
  roles:
    description: Ouvrir le menu de préparation (rôles, file)
    usage: /roles
    aliases: [lobby, play]
    permission: lolmc.player.roles

permissions:
  # ── Admin : lolmc.admin.<commande> (ex. lolmc.admin.join), groupes .config / .test / .game, tout : lolmc.admin.* ──
  lolmc.admin.*:
    description: Toutes les commandes admin (/lola)
    default: op
    children:
      lolmc.admin.config: true
      lolmc.admin.test: true
      lolmc.admin.game: true
  lolmc.admin:
    description: Ancien nom de lolmc.admin.* (toutes les commandes admin)
    default: op
    children:
      lolmc.admin.*: true
  lolmc.admin.config:
    description: Configurer la carte (monde template)
    default: op
    children:
      lolmc.admin.set: true
      lolmc.admin.position: true
      lolmc.admin.center: true
      lolmc.admin.plant: true
      lolmc.admin.schem: true
      lolmc.admin.road: true
      lolmc.admin.jungle: true
      lolmc.admin.baronpit: true
      lolmc.admin.shopnpc: true
      lolmc.admin.mode: true
      lolmc.admin.template: true
  lolmc.admin.test:
    description: Commandes de test
    default: op
    children:
      lolmc.admin.solo: true
      lolmc.admin.testgame: true
      lolmc.admin.give: true
      lolmc.admin.level: true
      lolmc.admin.gold: true
      lolmc.admin.hp: true
      lolmc.admin.resetcd: true
      lolmc.admin.buff: true
      lolmc.admin.spawn: true
      lolmc.admin.wave: true
      lolmc.admin.team: true
      lolmc.admin.debug: true
  lolmc.admin.game:
    description: Gérer les parties
    default: op
    children:
      lolmc.admin.start: true
      lolmc.admin.stop: true
      lolmc.admin.select: true
      lolmc.admin.join: true
      lolmc.admin.instance: true
      lolmc.admin.reload: true
      lolmc.admin.permcheck: true
  lolmc.admin.set:       {description: "/lola set — Placer les structures", default: op}
  lolmc.admin.position:  {description: "/lola position — Points d'apparition", default: op}
  lolmc.admin.center:    {description: "/lola center — Centre de la minimap", default: op}
  lolmc.admin.plant:     {description: "/lola plant — Plantes de la jungle", default: op}
  lolmc.admin.schem:     {description: "/lola schem — Schématiques", default: op}
  lolmc.admin.road:      {description: "/lola road — Routes des sbires", default: op}
  lolmc.admin.jungle:    {description: "/lola jungle — Camps de jungle", default: op}
  lolmc.admin.baronpit:  {description: "/lola baronpit — Formes de la fosse du Baron", default: op}
  lolmc.admin.shopnpc:   {description: "/lola shopnpc — PNJ boutique", default: op}
  lolmc.admin.mode:      {description: "/lola mode — Mode de partie", default: op}
  lolmc.admin.template:  {description: "/lola template — Monde template", default: op}
  lolmc.admin.solo:      {description: "/lola solo — Mode test solo", default: op}
  lolmc.admin.testgame:  {description: "/lola testgame — Partie test", default: op}
  lolmc.admin.give:      {description: "/lola give — Assigner un champion (et en changer en partie)", default: op}
  lolmc.admin.level:     {description: "/lola level — Changer de niveau", default: op}
  lolmc.admin.gold:      {description: "/lola gold — Ajouter de l'or", default: op}
  lolmc.admin.hp:        {description: "/lola hp — Modifier les PV", default: op}
  lolmc.admin.resetcd:   {description: "/lola resetcd — Réinitialiser les délais", default: op}
  lolmc.admin.buff:      {description: "/lola buff — Appliquer un buff", default: op}
  lolmc.admin.spawn:     {description: "/lola spawn — Faire apparaître une entité", default: op}
  lolmc.admin.wave:      {description: "/lola wave — Forcer une vague", default: op}
  lolmc.admin.team:      {description: "/lola team — Changer d'équipe", default: op}
  lolmc.admin.debug:     {description: "/lola debug — Mode debug", default: op}
  lolmc.admin.start:     {description: "/lola start — Lancer la partie", default: op}
  lolmc.admin.stop:      {description: "/lola stop — Arrêter la partie", default: op}
  lolmc.admin.select:    {description: "/lola select — Lancer la sélection des champions", default: op}
  lolmc.admin.join:      {description: "/lola join — Rejoindre une partie en cours", default: op}
  lolmc.admin.instance:  {description: "/lola instance — Lister / rejoindre une instance", default: op}
  lolmc.admin.reload:    {description: "/lola reload — Recharger la config", default: op}
  lolmc.admin.permcheck: {description: "/lola permcheck — Vérifier les permissions de skins", default: op}

  # ── Joueur : lolmc.player.<commande>, tout : lolmc.player.* ──
  lolmc.player.*:
    description: Toutes les commandes joueur
    default: true
    children:
      lolmc.player.shop: true
      lolmc.player.team: true
      lolmc.player.party: true
      lolmc.player.queue: true
      lolmc.player.recall: true
      lolmc.player.ping: true
      lolmc.player.pick: true
      lolmc.player.runes: true
      lolmc.player.spell: true
      lolmc.player.lock: true
      lolmc.player.roles: true
      lolmc.player.lobby: true
      lolmc.player.ff: true
      lolmc.player.stats: true
      lolmc.player.grimoire: true
      lolmc.player.honor: true
  lolmc.player:
    description: Ancien nom de lolmc.player.*
    default: true
    children:
      lolmc.player.*: true
  lolmc.player.shop:     {description: "Ouvrir la boutique", default: true}
  lolmc.player.team:     {description: "Rejoindre une équipe", default: true}
  lolmc.player.party:    {description: "Gérer son groupe", default: true}
  lolmc.player.queue:    {description: "Rejoindre la file", default: true}
  lolmc.player.recall:   {description: "Utiliser le recall", default: true}
  lolmc.player.ping:     {description: "Envoyer des pings", default: true}
  lolmc.player.pick:     {description: "Choisir un champion", default: true}
  lolmc.player.runes:    {description: "Configurer ses runes", default: true}
  lolmc.player.spell:    {description: "Choisir ses sorts", default: true}
  lolmc.player.lock:     {description: "Verrouiller sa sélection", default: true}
  lolmc.player.roles:    {description: "Choisir ses rôles", default: true}
  lolmc.player.lobby:    {description: "Ouvrir le menu de préparation", default: true}
  lolmc.player.ff:       {description: "Voter l'abandon (/l ff)", default: true}
  lolmc.player.stats:    {description: "Statistiques de la partie (/l stats)", default: true}
  lolmc.player.grimoire: {description: "Grimoire déchaîné (/l grimoire)", default: true}
  lolmc.player.honor:    {description: "Récapitulatif et vote d'honneur de fin de partie (/l recap, /l honor)", default: true}

